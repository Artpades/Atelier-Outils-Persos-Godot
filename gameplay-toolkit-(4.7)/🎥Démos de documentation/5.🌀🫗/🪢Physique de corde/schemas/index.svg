<svg viewBox="0 0 640 260" role="img" aria-label="Index fractionnaires le long d'une corde">
  <g font-size="12.5" fill="currentColor" font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="30" width="80" height="12" fill="currentColor" fill-opacity="0.3"/>
    <polyline points="80,60 150,64 220,76 290,96 360,124 430,160 500,204 570,256" fill="none" stroke="#c9a46b" stroke-width="4"/>
    <circle cx="80" cy="60" r="6" fill="currentColor"/><text x="80" y="48" text-anchor="middle" font-size="12">0</text><circle cx="150" cy="64" r="6" fill="currentColor"/><text x="150" y="52" text-anchor="middle" font-size="12">1</text><circle cx="220" cy="76" r="6" fill="currentColor"/><text x="220" y="64" text-anchor="middle" font-size="12">2</text><circle cx="290" cy="96" r="6" fill="currentColor"/><text x="290" y="84" text-anchor="middle" font-size="12">3</text><circle cx="360" cy="124" r="6" fill="currentColor"/><text x="360" y="112" text-anchor="middle" font-size="12">4</text><circle cx="430" cy="160" r="6" fill="currentColor"/><text x="430" y="148" text-anchor="middle" font-size="12">5</text><circle cx="500" cy="204" r="6" fill="currentColor"/><text x="500" y="192" text-anchor="middle" font-size="12">6</text><circle cx="570" cy="256" r="6" fill="currentColor"/><text x="570" y="244" text-anchor="middle" font-size="12">7</text>
    <circle cx="255.0" cy="86.0" r="7" fill="var(--accent)"/>
    <text x="267.0" y="106.0" fill="var(--accent)" font-weight="700">2,5 : get_position_at(2.5)</text>
    <text x="582" y="260">point_count - 1</text>
    <text x="330" y="40" font-family="JetBrains Mono, monospace" font-size="11.5">get_segment_length() = rope_length / (point_count - 1)</text>
