name: Build GDExtension

on:
  workflow_dispatch:  # déclenchement manuel depuis l'onglet "Actions"
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # crucial pour godot-cpp

      - name: Install SCons (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons

      - name: Install SCons (macOS)
        if: runner.os == 'macOS'
        run: brew install scons

      - name: Install SCons (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install scons

      - name: Build (release + debug)
        shell: bash
        run: |
          scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }}
          scons platform=${{ matrix.platform }} target=template_debug arch=${{ matrix.arch }}

      - name: Collect output
        shell: bash
        run: |
          mkdir -p dist/
          cp bin/*.${{ matrix.platform == 'windows' && 'dll' || matrix.platform == 'macos' && 'dylib' || 'so' }} dist/ 2>/dev/null || true
          # Copie les fichiers du bin/ (les noms exacts dépendent de ton SConstruct)
          cp bin/lib* dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/   
